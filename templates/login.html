<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Portfolio Tracker — Login</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      background: #0d1117;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Inter', system-ui, sans-serif;
    }
    .login-card {
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 12px;
      padding: 2.5rem;
      width: 100%;
      max-width: 380px;
    }
    .login-card h1 { font-size: 1.4rem; color: #e6edf3; font-weight: 600; }
    .login-card p  { color: #8b949e; font-size: .9rem; }
    .form-control {
      background: #0d1117;
      border: 1px solid #30363d;
      color: #e6edf3;
    }
    .form-control:focus {
      background: #0d1117;
      border-color: #388bfd;
      color: #e6edf3;
      box-shadow: 0 0 0 3px rgba(56,139,253,.2);
    }
    .btn-primary { background: #238636; border-color: #238636; font-weight: 500; }
    .btn-primary:hover { background: #2ea043; border-color: #2ea043; }
    .icon { font-size: 2.5rem; margin-bottom: .75rem; }
  </style>
</head>
<body>
  <div class="login-card text-center">
    <div class="icon">📊</div>
    <h1>Portfolio Tracker</h1>
    <p class="mb-4">Accedi al tuo portafoglio ETF</p>
    {% if error %}
    <div class="alert alert-danger py-2 text-start" style="font-size:.85rem;">{{ error }}</div>
    {% endif %}
    <form method="post">
      <div class="mb-3 text-start">
        <label class="form-label text-secondary small">Password</label>
        <input type="password" name="password" class="form-control" autofocus required placeholder="••••••••">
      </div>
      <button type="submit" class="btn btn-primary w-100">Accedi</button>
    </form>
  </div>
</body>
</html>
